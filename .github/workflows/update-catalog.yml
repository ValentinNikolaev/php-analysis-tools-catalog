name: Update PHP analysis catalog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: catalog-refresh-default-branch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Pin one reference time for generated artifacts
        run: echo "CATALOG_AS_OF=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Show catalog baseline
        run: |
          echo "Catalog entries:"
          find common/catalog -name '*.yaml' | sort | wc -l
          echo "Existing discovery candidates:"
          find common/candidates -name '*.yaml' 2>/dev/null | sort || true

      - name: Validate source baseline
        run: python scripts/validate_catalog.py

      - name: Refresh repository and package metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_catalog.py --max-failed-checks 10

      - name: Refresh and discover candidate tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/discover_tools.py --write --limit 20 --pages 3 --per-page 50
          --max-refresh-failures 5 --as-of "$CATALOG_AS_OF"

      - name: Generate editorial and Markdown artifacts
        run: |
          python scripts/generate_editor_choice.py --as-of "$CATALOG_AS_OF"
          python scripts/generate_readme.py --as-of "$CATALOG_AS_OF"
          python scripts/generate_exports.py --as-of "$CATALOG_AS_OF"

      - name: Validate mutated sources
        run: python scripts/validate_catalog.py

      - name: Build the production site
        run: python scripts/generate_site.py --output site-dist --as-of "$CATALOG_AS_OF"

      - name: Run the full test suite after mutation
        run: python -m unittest discover -s tests

      - name: Verify generators are idempotent
        shell: bash
        run: |
          tracked_paths=(
            common/catalog
            common/candidates
            common/editor-choice.yaml
            exports
            README.md
            EDITOR-CHOISE.md
            EDITORS-CHOICE.md
          )
          git diff --binary -- "${tracked_paths[@]}" > "$RUNNER_TEMP/generated-before.patch"
          python scripts/generate_editor_choice.py --as-of "$CATALOG_AS_OF"
          python scripts/generate_readme.py --as-of "$CATALOG_AS_OF"
          python scripts/generate_exports.py --as-of "$CATALOG_AS_OF"
          git diff --binary -- "${tracked_paths[@]}" > "$RUNNER_TEMP/generated-after.patch"
          cmp "$RUNNER_TEMP/generated-before.patch" "$RUNNER_TEMP/generated-after.patch"

      - name: Show reviewed change scope
        run: |
          git status --short -- \
            common/catalog \
            common/candidates \
            common/rejected-candidates.yaml \
            common/editor-choice.yaml \
            exports \
            README.md \
            EDITOR-CHOISE.md \
            EDITORS-CHOICE.md
          git diff --stat -- \
            common/catalog \
            common/candidates \
            common/rejected-candidates.yaml \
            common/editor-choice.yaml \
            exports \
            README.md \
            EDITOR-CHOISE.md \
            EDITORS-CHOICE.md

      - name: Commit and push the catalog refresh
        id: publish
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- \
            common/catalog \
            common/candidates \
            common/rejected-candidates.yaml \
            common/editor-choice.yaml \
            exports \
            README.md \
            EDITOR-CHOISE.md \
            EDITORS-CHOICE.md

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalog changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh catalog metadata"
          git push origin "HEAD:${DEFAULT_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report publication result
        run: |
          echo "changed=${{ steps.publish.outputs.changed }}"
          echo "commit=${{ steps.publish.outputs.commit }}"
